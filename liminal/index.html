<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LIMINAL: an agent environment that steers sound at the edge of sleep, replayed on one real night of BrainCo EEG.">
<title>Liminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One rendered object on black. Record = the night in polar form (angle = time). Frame strips and pockets = live instruments. No words. */
:root{
  color-scheme: dark;
  --bg:#050506; --fg:#d7d8dc; --mute:#5d6068; --line:#24262b; --live:#5fd39a;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#play{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
#play:hover{border-color:var(--mute)}
#play:focus-visible{outline:2px solid var(--live);outline-offset:3px}
#play svg{width:15px;height:15px;fill:currentColor}
.cap{font:500 10px/1 var(--mono);letter-spacing:.55em;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.cap i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--line);margin:0 .9em 0 .4em;vertical-align:middle;transition:background .4s, box-shadow .4s}
.cap i.on{background:var(--live);box-shadow:0 0 8px var(--live)}
#c.hot{cursor:pointer}

/* hover tag at the cursor: one decoded word */
#tag{position:fixed;left:0;top:0;pointer-events:none;font:400 10px/14px var(--nn-mono);letter-spacing:.06em;color:var(--nn-ink);
  padding:3px 8px;border-radius:999px;background:rgba(7,7,7,.72);border:1px solid var(--nn-edge);opacity:0;transform:translate(14px,-26px);transition:opacity .25s;white-space:nowrap}
#tag.on{opacity:1}
#tag .nz,.nn .nz{color:var(--nn-noise)}

/* ---- Noir Node window (tokens from the Noir Node design system; applies to this window only) ---- */
:root{
  --nn-node-top:#282828; --nn-node-head:#181818; --nn-body-top:#151515; --nn-body-bottom:#0b0b0b; --nn-well:#050505; --nn-divider:#040404;
  --nn-edge:#2f2f2f; --nn-edge-hi:#4a4a4a; --nn-ink:#ececec; --nn-muted:#8f8f8f; --nn-noise:#8f8f8f;
  --nn-led-off:#707070; --nn-live:#f2f2f2; --nn-ctl-top:#1e1e1e; --nn-ctl-bottom:#0d0d0d; --nn-ctl-edge:#2c2c2c; --nn-focus:#f2f2f2;
  --nn-sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --nn-light:"Helvetica Light","HelveticaNeue-Light","Helvetica Neue", Helvetica, Arial, sans-serif;
  --nn-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
#wires{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nn{position:fixed;right:32px;top:50%;width:300px;max-width:calc(100vw - 32px);box-sizing:border-box;border:1px solid var(--nn-edge);border-radius:14px;
  background:linear-gradient(var(--nn-body-top),var(--nn-body-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.06);color:var(--nn-ink);
  font-family:var(--nn-sans);opacity:0;transform:translateY(-50%) scale(.94);transform-origin:0 50%;pointer-events:none;
  transition:opacity .42s cubic-bezier(.16,1,.3,1), transform .56s cubic-bezier(.16,1,.3,1), border-color .2s}
.nn.open{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.nn:hover{border-color:var(--nn-edge-hi)}
.nn-head{height:44px;box-sizing:border-box;padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(var(--nn-node-top),var(--nn-node-head));border-bottom:1px solid var(--nn-divider);border-radius:13px 13px 0 0}
.nn-title{font:400 13px/16px var(--nn-sans);letter-spacing:.2em;margin:0}
.nn-led{width:7px;height:7px;border-radius:50%;background:var(--nn-led-off)}
.nn-led.on{background:var(--nn-live);box-shadow:0 0 8px rgba(255,255,255,.55)}
.nn-port{position:absolute;left:-5px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--nn-live);box-shadow:0 0 10px rgba(255,255,255,.35)}
.nn-params{padding:16px 24px 4px;display:grid;gap:4px;margin:0}
.nn-params div{font:400 13px/22px var(--nn-sans);display:flex;gap:.5em;margin:0}
.nn-params dt{color:var(--nn-muted)} .nn-params dd{margin:0;color:var(--nn-ink);min-width:0;overflow-wrap:anywhere}
.nn-well{margin:12px 24px 0;background:var(--nn-well);border:1px solid var(--nn-divider);border-radius:8px;padding:12px}
.nn-well canvas{display:block;width:100%;height:104px}
.nn-text{margin:0;padding:16px 24px 0;font:300 14px/21px var(--nn-light);color:var(--nn-ink);min-height:63px}
.nn-actions{padding:16px 24px 24px;display:flex;gap:12px}
.nn-btn{height:36px;padding:0 18px;border-radius:999px;border:1px solid var(--nn-ctl-edge);background:linear-gradient(var(--nn-ctl-top),var(--nn-ctl-bottom));
  color:var(--nn-ink);font:400 12px/14px var(--nn-sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);display:inline-flex;align-items:center;gap:8px}
.nn-btn:hover{border-color:var(--nn-edge-hi)}
.nn-btn:focus-visible,.nn:focus-visible{outline:2px solid var(--nn-focus);outline-offset:2px}
.nn-btn i{width:6px;height:6px;border-radius:50%;background:var(--nn-led-off)}
@media (max-width:760px){
  .nn{right:16px;left:16px;width:auto;top:auto;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateY(12px);transform-origin:50% 100%;max-height:calc(100vh - 140px);overflow:auto}
  .nn.open{transform:none}
  .nn-port{display:none}
}
@media (prefers-reduced-motion:reduce){ .nn{transition:opacity .2s} }
</style>
</head>

<div id="tag" aria-hidden="true"></div>

  <div class="nn-well"><canvas id="nn-dia" aria-hidden="true"></canvas></div>

function drawFace(c){

    ctx.save(); ctx.globalAlpha=.9; ctx.imageSmoothingQuality='high'; ctx.drawImage(glowC,GB.x,GB.y,glowC.width/k,glowC.height/k); ctx.restore(); }
  ctx.save(); ctx.globalAlpha=.88; prints(ctx); ctx.restore();
  if(hl>.01 && HV && HV.shape.space==='deck'){ const r=HV.shape, o=7/s, rad=10/s; ctx.save();
    ctx.strokeStyle=`rgba(255,255,255,${.14*hl})`; ctx.lineWidth=6/s; rrPath(ctx,r.x-o,r.y-o,r.w+2*o,r.h+2*o,rad); ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${.55*hl})`; ctx.lineWidth=1/s; rrPath(ctx,r.x-o,r.y-o,r.w+2*o,r.h+2*o,rad); ctx.stroke(); ctx.restore(); }
  // arm: soft shadow, then the rendered arm rotated about its pivot
  ctx.save(); ctx.translate(PV.x+14+30*lift, PV.y+22+40*lift); ctx.rotate(armRot); ctx.globalAlpha=.55-.12*lift;
  ctx.drawImage(shadowC,-1080,-1080,2160,2160); ctx.restore();
  ctx.save(); ctx.translate(PV.x,PV.y); ctx.rotate(armRot); ctx.drawImage(imgs.arm,-1080,-1080,2160,2160); ctx.restore();
  if(openId){ ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(anchor.x,anchor.y,13/s,0,TAU); ctx.fill();
    ctx.fillStyle='#f2f2f2'; ctx.beginPath(); ctx.arc(anchor.x,anchor.y,4.5/s,0,TAU); ctx.fill(); }
  drawWire(ox,oy,s);

  const tt=hhmm(T); if(tt!==lastTT){ lastTT=tt; elTime.textContent=tt; } if(on!==lastOn){ lastOn=on; elDot.classList.toggle('on',on); }
}
function setPlaying(v){ playing=v; document.getElementById('icon').setAttribute('d',v?'M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z':'M4 2.5v11l9-5.5z'); document.getElementById('play').setAttribute('aria-label',v?'Pause':'Play the night'); }
document.getElementById('play').addEventListener('click',()=>{ if(!A) startAudio(); else if(A.ac.state!=='running') A.ac.resume(); if(T>=NIGHT-.02) T=0; setPlaying(!playing); });
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); document.getElementById('play').click(); } });
/* ================= hover, decode, Noir Node window ================= */
let shiftX=0, hl=0, hlT=0, hov=null, openId=null, openItem=null, anchor={x:0,y:0}, wireP=0, sz=0;
const tagEl=document.getElementById('tag'), nn=document.getElementById('nn'), wireEl=document.getElementById('wire'), wglowEl=document.getElementById('wglow');
const NAMES_PARAM=['tempo','modulation','volume','brightness','noise'], NAMES_STAGE=['awake','rem','light','deep'], NAMES_EEG=['theta','alpha','beta'];
function rrPath(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function addShape(c,sh){
  if(sh.type==='ring'){ c.moveTo(sh.r1,0); c.arc(0,0,sh.r1,0,TAU); c.moveTo(sh.r0,0); c.arc(0,0,sh.r0,0,TAU); }
  else if(sh.type==='sector'){ const a0=ang(sh.t0), a1=ang(sh.t1); c.moveTo(Math.cos(a0)*sh.r0,Math.sin(a0)*sh.r0); c.arc(0,0,sh.r1,a0,a1); c.arc(0,0,sh.r0,a1,a0,true); c.closePath(); }
  else if(sh.type==='dot'){ c.moveTo(sh.x+sh.r,sh.y); c.arc(sh.x,sh.y,sh.r,0,TAU); }
  else if(sh.type==='disk'){ c.moveTo(sh.r,0); c.arc(0,0,sh.r,0,TAU); }
}
function shiftTarget(){ if(!openId||!V.ready||V.W<=760) return 0; const right=V.ox+M.deck.w*V.s, room=V.W-300-64; return Math.max(Math.min(0,room-right), 16-V.ox); }
function toDeck(cx,cy){ return {x:(cx-V.ox-shiftX)/V.s, y:(cy-V.oy)/V.s}; }
function timeAt(a){ let best=0,bd=9; for(let m=0;m<NIGHT;m+=.5){ const d=Math.abs(((ang(m)-a)%TAU+TAU+Math.PI)%TAU-Math.PI); if(d<bd){bd=d;best=m;} } return best; }
function hitTest(px,py){
  const inR=(r)=>px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;
  const deckRects=[
    ['brain',{x:STRIP_TOP.x0,y:STRIP_TOP.y-STRIP_TOP.h*.8,w:STRIP_TOP.x1-STRIP_TOP.x0,h:STRIP_TOP.h*1.3}],
    ['sound',{x:STRIP_BOT.x0,y:STRIP_BOT.y-STRIP_BOT.h*.8,w:STRIP_BOT.x1-STRIP_BOT.x0,h:STRIP_BOT.h*1.3}],
    ['levels',{x:P1.x0,y:P1.y0,w:P1.x1-P1.x0,h:P1.y1-P1.y0}],
    ['events',{x:P1.x0,y:P2.y0-14,w:P1.x1-P1.x0,h:(P2.y1-P2.y0)*.52}],
    ['windows',{x:P1.x0,y:P2.y0+(P2.y1-P2.y0)*.6,w:P1.x1-P1.x0,h:(P2.y1-P2.y0)*.42}]];
  for(const [id,r] of deckRects) if(inR(r)) return {id, shape:{space:'deck',type:'rect',...r}};
  const x=px-RC.x, y=py-RC.y, r=Math.hypot(x,y), a=Math.atan2(y,x);
  if(r>640) return null;
  if(r<=RB.label) return {id:'agent', shape:{space:'rec',type:'disk',r:RB.label}};
  for(const e of EVENTS){ const ea=ang(e.m), ex=Math.cos(ea)*(RB.pOut+34), ey=Math.sin(ea)*(RB.pOut+34); if(Math.hypot(x-ex,y-ey)<20) return {id:e.type, shape:{space:'rec',type:'dot',x:ex,y:ey,r:22}}; }
  for(const m of D.failed_attempts_min){ const fa=ang(m), fr=RB.sOut-SLANE, fx=Math.cos(fa)*fr, fy=Math.sin(fa)*fr; if(Math.hypot(x-fx,y-fy)<12) return {id:'attempt', shape:{space:'rec',type:'dot',x:fx,y:fy,r:14}}; }
  const m=timeAt(a), w=inWin(m);
  if(m>=BR.t0 && m<=BR_T1) for(const lane of [LANE.awake,LANE.light]){ const rr=RB.sOut-SLANE*(lane+.5);
    if(Math.abs(r-(rr+SLANE*.36))<6||Math.abs(r-(rr-SLANE*.36))<6) return {id:'branch', shape:{space:'rec',type:'sector',t0:BR.t0,t1:BR_T1,r0:rr-SLANE*.5,r1:rr+SLANE*.5}}; }
  for(const [c0,c1] of D.contact_off_min) if(m>=c0-.5&&m<=c1+.5&&r>RB.sIn-8&&r<RB.sOut+8) return {id:'dropout', shape:{space:'rec',type:'sector',t0:c0,t1:c1,r0:RB.sIn-8,r1:RB.sOut+8}};
  if(r>=RB.pIn&&r<=RB.pOut){ const j=clamp(Math.floor((RB.pOut-r)/PLANE),0,4); return {id:NAMES_PARAM[j], shape:{space:'rec',type:'ring',r0:RB.pOut-PLANE*(j+1),r1:RB.pOut-PLANE*j}}; }
  if(r>=RB.sIn&&r<=RB.sOut){ const j=clamp(Math.floor((RB.sOut-r)/SLANE),0,3); return {id:NAMES_STAGE[j], shape:{space:'rec',type:'ring',r0:RB.sOut-SLANE*(j+1),r1:RB.sOut-SLANE*j}}; }
  if(r>=RB.eIn&&r<=RB.eOut){ const j=clamp(Math.floor((RB.eOut-r)/ELANE),0,2); return {id:NAMES_EEG[j], shape:{space:'rec',type:'ring',r0:RB.eOut-ELANE*(j+1),r1:RB.eOut-ELANE*j}}; }
  if(w && r>RB.pOut && r<620) return {id:'window', win:w, shape:{space:'rec',type:'sector',t0:w.a,t1:w.b,r0:RB.eIn-4,r1:RB.pOut+30}};
  return null;
}
const sameHit=(a,b)=>a&&b&&a.id===b.id&&(a.win?.i??-1)===(b.win?.i??-1);

/* decode: scrambled glyphs resolve front to back (Noir Node "decode") */
const GLY='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz0123456789#%&*+=<>/';
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function decode(el,text,ms,delay=0){
  const tok=(el._tok=(el._tok||0)+1), t0=performance.now()+delay;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=text; return; }
  const tick=(now)=>{ if(el._tok!==tok) return; const p=clamp((now-t0)/ms,0,1), front=p*text.length;
    let done='', noise=''; for(let i=0;i<text.length;i++){ const ch=text[i]; if(i<front||ch===' '||ch==='\n') { if(noise){ done+='<span class="nz">'+esc(noise)+'</span>'; noise=''; } done+=esc(ch); } else noise+=GLY[(Math.random()*GLY.length)|0]; }
    if(noise) done+='<span class="nz">'+esc(noise)+'</span>'; el.innerHTML=done; if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* what each element is: params rows, a one-line intro, and the series drawn in the well */
const normBand=k=>{ const Q=QB[k]; return D.band5s[k].map(v=>v==null?0:clamp((v-Q[0])/(Q[1]-Q[0]),0,1)); };
const stageCount=k=>D.stage.filter(x=>x===k).length;
const drowSeries=(m0,m1)=>D.drow.slice(Math.max(0,Math.floor(m0*2)),Math.floor(m1*2)).map(v=>(v??0)/100);
function info(h){
  const id=h.id, pj=NAMES_PARAM.indexOf(id), sj=NAMES_STAGE.indexOf(id), ej=NAMES_EEG.indexOf(id);
  if(pj>=0){ const [k,lo,hi]=PARAM[pj]; const unit={tempo:'40–140 bpm',am:'0–32 hz',vol:'relative · capped',bright:'200 hz–8 khz',noise:'0–1 blend'}[k];
    const txt={tempo:'How fast the music pulses. The agent slows it as you drift toward sleep.',
      am:'How fast the loudness of the music flutters. Quick for focus, slow for drifting down.',
      vol:'How loud the music is. It fades almost to silence once you are asleep.',
      bright:'How bright or dark the sound is. Darker as you go down, brighter to wake.',
      noise:'A soft bed of pink noise under the music that masks the room.'}[k];
    return {title:id, live:true, rows:[['type','action'],['range',unit],['plays','only when the agent steps in']], text:txt, ch:id[0], series:TRACE.map(p=>p.on?clamp((p[k]-lo)/(hi-lo),0,1):0), night:true}; }
  if(sj>=0){ const n=stageCount(id);
    const txt={awake:'Time the headband read as awake.',rem:'Time the headband read as dreaming sleep. Near sleep onset it may be mislabelled light sleep.',light:'Time the headband read as light sleep.',deep:'Time the headband read as deep sleep.'}[id];
    return {title:id, live:false, rows:[['type','observation'],['source','brainco headband · 30 s'],['total',(n/2).toFixed(1)+' min']], text:txt+' An estimate, not a sleep lab.', ch:id[0], series:D.stage.map(x=>x===id?1:0), night:true}; }
  if(ej>=0){ const k=id==='beta'?'beta':id;
    const txt={theta:'Slow brain waves that rise as you fall asleep.',alpha:'Relaxed brain waves. On this forehead channel they rose after sleep onset.',beta:'Busy, waking brain waves. They fall as you fall asleep.'}[id];
    return {title:id, live:false, rows:[['type','observation'],['band',{theta:'4–8 hz',alpha:'8–12 hz',beta:'12–20 hz'}[id]],['step','5 s · whole night']], text:txt, ch:{theta:'θ',alpha:'α',beta:'β'}[id], series:normBand(k), night:true}; }
  if(id==='window'){ const w=h.win; return {title:'window'+(w.i+1), live:T>=w.a&&T<=w.b, rows:[['onset',hhmm(w.onset)],['task',w.dive?'dive':'guard'],['span',hhmm(w.a)+' – '+hhmm(w.b)]],
      text:w.dive?'You fall asleep here. The agent guides you down, holds you at the edge, then wakes you.':'You drift back to sleep after waking. The agent stays soft and lets you sleep.', ch:'w', series:drowSeries(w.a-6,w.b+6), mark:null}; }
  const dv=WIN[0];
  const ev={prime:'A cue word whispered at the edge of sleep to steer what you think about.',wake:'A gentle rising chime that wakes you before deeper sleep.',capture:'The agent asks what was on your mind and keeps the answer.'};
  if(ev[id]){ const e=EVENTS.find(q=>q.type===id); return {title:id, live:fired.size>0&&T>=e.m, rows:[['type','action · event'],['at',hhmm(e.m)],['window','1 · dive']], text:ev[id], ch:id[0], series:drowSeries(dv.a-6,dv.b+6), markAt:(e.m-(dv.a-6))/((dv.b+6)-(dv.a-6))}; }
  if(id==='attempt') return {title:'attempt', live:false, rows:[['type','observation'],['at',D.failed_attempts_min.map(hhmm).join(' · ')],['signal','drowsiness spike']], text:'Drowsiness jumped but the headband still said awake. Failed tries at falling asleep.', ch:'d', series:drowSeries(25,70), marks:D.failed_attempts_min.map(m=>(m-25)/45)};
  if(id==='dropout'){ const [c0,c1]=D.contact_off_min[0]; return {title:'dropout', live:false, rows:[['type','observation gap'],['span',hhmm(c0)+' – '+hhmm(c1)],['length',((c1-c0)).toFixed(1)+' min']], text:'The headband lost contact with the skin. There is no data here.', ch:'θ', series:normBand('theta').slice(Math.floor(25*12),Math.floor(42*12))}; }
  if(id==='branch') return {title:'branch', live:false, rows:[['type','simulation · '+BR.runs+' runs'],['asleep','peak '+Math.round(100*Math.max(...BR.N1.map((v,i)=>v+BR.N2[i])))+'% of runs'],['idea','captured in '+Math.round(100*BR.idea_rate)+'%']],
      text:'What the model predicts if the agent had played this window. Line strength is the share of runs: awake on the outer lane, light sleep on the inner one (N1 outside, N2 inside). A prediction, not data.', ch:'s', series:BR.N1.map((v,i)=>Math.min(1,(v+BR.N2[i])*5))};
  if(id==='agent') return {title:'agent', live:policy(T).on&&playing, rows:[['type','rule agent · causal'],['belief',policy(T).belief.toLowerCase()],['sees','drowsiness + label, never the future']], text:'What the agent believes right now: awake, drifting, at the edge, waking you, listening, or asleep. It trusts sleep only when drowsiness and the headband label agree.', ch:'a', noise:true};
  if(id==='brain') return {title:'brain', live:true, rows:[['type','observation'],['band','theta · last 10 min'],['role','what the agent hears']], text:'Your brain, as the agent hears it: the last ten minutes of slow waves.', ch:'θ', series:normBand('theta').slice(Math.max(0,Math.floor(T*12)-120),Math.floor(T*12)+1)};
  if(id==='sound') return {title:'sound', live:sound>.1, rows:[['type','action'],['source','live audio output'],['role','how the agent answers']], text:'The agent’s answer: the music it is playing right now.', ch:'s', series:TRACE.map(p=>p.on?p.vol:0), night:true};
  if(id==='levels') return {title:'levels', live:sound>.1, rows:[['type','action'],['columns','tempo · am · vol · bright · noise'],['scale','12 steps']], text:'Live levels of the five sound controls the agent turns.', ch:'l', series:TRACE.map(p=>p.on?(p.tempo-40)/100:0), night:true};
  if(id==='events') return {title:'events', live:flash.prime+flash.wake+flash.capture>0, rows:[['▼','prime'],['▲','wake'],['○','capture']], text:'Lights up when the agent whispers a cue, wakes you, or asks what was on your mind.', ch:'e', series:drowSeries(dv.a-6,dv.b+6), marks:EVENTS.map(e=>(e.m-(dv.a-6))/((dv.b+6)-(dv.a-6)))};
  if(id==='windows') return {title:'windows', live:!!inWin(T), rows:[['count',String(WIN.length)],['onsets',WIN.map(w=>hhmm(w.onset)).join(' · ')],['green','simulated success · 4 dots']], text:'One row per moment of falling asleep in this night. Green dots show how often the simulated agent succeeded there: ideas caught in window 1, sleep left alone in windows 2 to 4.', ch:'w', series:D.stage.map(x=>x==='awake'?1:0), night:true, marks:WIN.map(w=>w.onset/NIGHT)};
  return {title:id, rows:[], text:'', ch:'', series:[0,0]};
}

/* the well: a wave diagram (grey band, light top edge, end dots, dashed baseline, channel letter) */
function drawDiagram(it){
  const c=document.getElementById('nn-dia'), r=c.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  const W=r.width, H=r.height, top=18, base=H-10;
  g.clearRect(0,0,W,H);
  g.strokeStyle='#3a3a3a'; g.setLineDash([3,4]); g.lineWidth=1; g.beginPath(); g.moveTo(0,base+.5); g.lineTo(W,base+.5); g.stroke(); g.setLineDash([]);
  g.fillStyle='#8f8f8f'; g.font='400 11px '+getComputedStyle(document.documentElement).getPropertyValue('--nn-sans'); g.textAlign='center'; g.fillText(it.ch||'',W/2,11);
  if(it.noise){ for(let y=top;y<base;y+=6) for(let x=0;x<W;x+=6){ const v=.5+.5*Math.sin(x*.07+y*.11)*Math.cos(x*.031-y*.05); g.fillStyle=`rgba(142,142,142,${.12+.5*v*v})`; g.fillRect(x,y,5,5); } return; }
  const src=it.series||[0,0], n=Math.max(2,Math.min(240,src.length)), pts=[];
  for(let i=0;i<n;i++){ const a0=Math.floor(i*src.length/n), a1=Math.max(a0+1,Math.floor((i+1)*src.length/n)); let m=0; for(let j=a0;j<a1;j++) m+=src[j]||0; pts.push(m/(a1-a0)); }
  const X=i=>i/(n-1)*W, Y=v=>base-v*(base-top);
  g.beginPath(); g.moveTo(0,base); pts.forEach((v,i)=>g.lineTo(X(i),Y(v))); g.lineTo(W,base); g.closePath(); g.fillStyle='#8e8e8e'; g.globalAlpha=.55; g.fill(); g.globalAlpha=1;
  g.beginPath(); pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.strokeStyle='#d0d0d0'; g.lineWidth=1; g.stroke();
  g.fillStyle='#d0d0d0'; [[0,pts[0]],[n-1,pts[n-1]]].forEach(([i,v])=>{ g.beginPath(); g.arc(X(i),Y(v),2.2,0,TAU); g.fill(); });
  const mk=[...(it.marks||[]), ...(it.markAt!=null?[it.markAt]:[])];
  mk.forEach(u=>{ const x=clamp(u,0,1)*W; g.strokeStyle='#ececec'; g.lineWidth=1; g.beginPath(); g.moveTo(x,top-4); g.lineTo(x,base); g.stroke(); g.fillStyle='#ececec'; g.beginPath(); g.moveTo(x-4,top-8); g.lineTo(x+4,top-8); g.lineTo(x,top-3); g.closePath(); g.fill(); });
  if(it.night){ const x=T/NIGHT*W; g.strokeStyle='rgba(236,238,242,.45)'; g.setLineDash([2,3]); g.beginPath(); g.moveTo(x,top-4); g.lineTo(x,base); g.stroke(); g.setLineDash([]); }
}
function openNode(h,pt){
  const it=info(h); openId=h.id+(h.win?h.win.i:''); openItem=h; anchor=pt; wireP=0;
  document.getElementById('nn-led').classList.toggle('on',!!it.live);
  decode(document.getElementById('nn-title'),it.title,400,90);
  const dl=document.getElementById('nn-params'); dl.innerHTML=it.rows.map(([k,v])=>`<div><dt>${esc(k)}:</dt><dd data-v="${esc(v)}"></dd></div>`).join('');
  dl.querySelectorAll('dd').forEach(dd=>decode(dd,dd.dataset.v,400,90));
  decode(document.getElementById('nn-text'),it.text,clamp(it.text.length*9,400,1300),90);
  nn.classList.add('open'); requestAnimationFrame(()=>drawDiagram(it));
  busy=true;
}
function closeNode(){ if(!openId) return; openId=null; openItem=null; nn.classList.remove('open'); wireEl.setAttribute('d',''); wglowEl.setAttribute('d',''); busy=true; }
function drawWire(ox,oy,s){
  if(!openId||V.W<=760){ wireEl.setAttribute('d',''); wglowEl.setAttribute('d',''); return; }
  const r=nn.getBoundingClientRect(), x1=ox+anchor.x*s, y1=oy+anchor.y*s, x2=r.left-1, y2=r.top+21;
  const dx=x2-x1, dy=y2-y1; let d=Math.min(320,Math.max(Math.abs(dx)*.5,40)); if(dx<0) d=Math.max(d,60+Math.abs(dy)*.25);
  const path=`M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1+d).toFixed(1)},${y1.toFixed(1)} ${(x2-d).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  const e=1-Math.pow(1-wireP,3);
  for(const el of [wireEl,wglowEl]){ el.setAttribute('d',path); el.setAttribute('stroke-dasharray','1 1'); el.setAttribute('stroke-dashoffset',String(1-e)); }
}
cv.addEventListener('pointermove',e=>{
  if(!V.ready||e.pointerType==='touch') return; const p=toDeck(e.clientX,e.clientY), h=hitTest(p.x,p.y);
  tagEl.style.left=e.clientX+'px'; tagEl.style.top=e.clientY+'px';
  if(!sameHit(h,hov)){ hov=h; hl=0; hlT=h?1:0; busy=true;
    if(h){ tagEl.classList.add('on'); decode(tagEl,h.id==='window'?'window':h.id,380); cv.classList.add('hot'); }
    else { tagEl.classList.remove('on'); cv.classList.remove('hot'); } }
});
cv.addEventListener('pointerleave',()=>{ hov=null; hlT=0; tagEl.classList.remove('on'); cv.classList.remove('hot'); });
cv.addEventListener('click',e=>{ if(!V.ready) return; const p=toDeck(e.clientX,e.clientY), h=hitTest(p.x,p.y);
  if(h){ if(e.pointerType==='touch'||!hov){ hov=h; hlT=1; } openNode(h,p); } else closeNode(); });
document.getElementById('nn-close').addEventListener('click',closeNode);
addEventListener('keydown',e=>{ if(e.key==='Escape') closeNode(); });
addEventListener('resize',layout); if(window.ResizeObserver) new ResizeObserver(()=>layout()).observe(cv);
layout(); requestAnimationFrame(frame);
</script>
