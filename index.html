<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAS.S60.romaluo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <svg id="wires" aria-hidden="true">
    <path id="wire-in" class="wire" d=""/>
    <path id="wire-out" class="wire" d=""/>
    <circle id="wire-in-a" class="wire-dot" r="3"/>
    <circle id="wire-in-b" class="wire-dot" r="3"/>
    <circle id="wire-out-a" class="wire-dot" r="3"/>
    <circle id="wire-out-b" class="wire-dot" r="3"/>
  </svg>

  <main id="graph">
    <section class="node" id="node-input" data-label="S60-IN">
      <header class="node__head">
        <span class="node__label">S60-IN</span>
        <span class="node__led" data-state="idle"></span>
      </header>
      <div class="node__body">
        <textarea id="query" rows="4" placeholder="ask me anything…"></textarea>
        <div class="input-tools">
          <button id="mic-btn" title="speak"><span class="mic-dot"></span>REC</button>
          <span class="hint">↵ send · ⇧↵ newline · / focus</span>
        </div>
      </div>
      <footer class="node__meta" id="input-meta">
        <div class="meta-row"><span>Mode:</span><b id="input-mode">static</b></div>
        <div class="meta-row"><span>Status:</span><b id="input-status">idle</b></div>
      </footer>
    </section>

    <section class="node" id="node-self" data-label="S60-SELF">
      <header class="node__head">
        <span class="node__label">S60-SELF</span>
        <span class="node__led" id="self-led" data-state="idle"></span>
      </header>
      <div class="node__body">
        <div class="portrait" id="portrait"></div>
      </div>
      <footer class="node__meta" id="self-meta"></footer>
    </section>

    <section class="node" id="node-output" data-label="S60-OUT-01">
      <header class="node__head">
        <span class="node__label" id="output-label">S60-OUT-01</span>
        <span class="node__led" id="output-led" data-state="empty"></span>
      </header>
      <div class="node__body" id="output-body">
        <p class="placeholder">waiting for input</p>
      </div>
      <footer class="node__meta hidden" id="output-meta"></footer>
      <a class="node__more hidden" id="output-more" href="#">See more</a>
    </section>
  </main>

  <div id="doc-mask" class="hidden"></div>
  <div id="doc-overlay" class="node node--wide hidden">
    <header class="node__head">
      <span class="node__label" id="doc-label">S60-MEM</span>
      <button class="node__close" id="doc-close" aria-label="close"></button>
    </header>
    <div class="node__body doc-body" id="doc-body"></div>
    <footer class="node__meta" id="doc-meta"></footer>
  </div>

  <div id="index-overlay" class="hidden">
    <p id="index-title">INDEX</p>
    <div id="index-grid"></div>
  </div>

  <button id="index-dot" title="index"></button>

  <script src="js/markdown.js"></script>
  <script src="js/face.js"></script>
  <script src="js/facevideo.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/rag.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/agentloop.js"></script>
  <script src="js/ollama.js"></script>
  <script src="js/deepseek.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
