<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAS.S60.romaluo</title>
<style>
  /* boot v2 critical css: paints on the first frame, before any script */
  #boot{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .6s ease}
  #boot.boot--done{opacity:0;pointer-events:none}
  #boot .boot__name{color:#d4d4d4;font:400 15px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.18em}
  #boot .boot__bar{width:min(220px,40vw);height:1px;background:rgba(255,255,255,.15)}
  #boot .boot__bar-fill{display:block;height:100%;width:0;background:rgba(255,255,255,.85);transition:width .25s ease}
  html[data-boot=off] #boot{display:none!important}
</style>
<script>
  /* boot v2 suppression check — runs before first paint: plays on every
     page load, skipped only under ?brain=static */
  if (/(?:\?|&)brain=static\b/.test(location.search)) {
    document.documentElement.dataset.boot = 'off';
  }
</script>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="boot">
    <div class="boot__name">mit.s60.romaluo.agent</div>
    <div class="boot__bar"><span class="boot__bar-fill" id="boot-bar"></span></div>
  </div>
  <script>
    /* boot v2 bootstrap: skip + failsafe, independent of every later script */
    (function () {
      var el = document.getElementById('boot');
      if (!el) return;
      if (document.documentElement.dataset.boot === 'off') { el.parentNode.removeChild(el); return; }
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        window.removeEventListener('keydown', onKey);
        el.classList.add('boot--done');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650);
      }
      var onKey = function () { finish(); };
      window.__bootFinish = finish;
      el.addEventListener('click', finish);
      window.addEventListener('keydown', onKey);
      setTimeout(finish, 20000); // failsafe: never a stuck black screen
    })();
  </script>
  <script src="js/boot.js"></script>

  <div class="stage" id="stage" aria-label="Board: scroll to zoom, drag a window to move it">
    <div class="canvas" id="canvas">

      <section class="node node--short" id="node-input" data-kind="text" data-label="s60-in" data-x="60" data-y="90">
        <header class="node__head">
          <span class="node__label">s60-in</span>
          <span class="node__led" data-state="idle"></span>
        </header>
        <div class="node__body">
          <textarea id="query" rows="4" placeholder="enter input"></textarea>
          <div class="input-tools">
            <button id="mic-btn" class="btn" type="button" title="speak"><span class="btn__dot mic-dot"></span><span class="btn__label">rec</span></button>
            <button id="send-btn" class="btn" type="button" title="send"><span class="btn__dot"></span><span class="btn__label">send</span></button>
          </div>
        </div>
        <footer class="node__meta">
          <div class="meta-rows">
            <div class="meta-row"><span>Mode:</span><b id="input-mode">static</b></div>
            <div class="meta-row"><span>Status:</span><b id="input-status">idle</b></div>
          </div>
        </footer>
      </section>

      <section class="node node--image" id="node-self" data-kind="image" data-label="s60-self" data-x="440" data-y="40">
        <header class="node__head">
          <span class="node__label">s60-self</span>
          <span class="node__led" id="self-led" data-state="idle"></span>
        </header>
        <div class="node__body">
          <div class="portrait" id="portrait"></div>
        </div>
        <footer class="node__meta">
          <div class="meta-rows" id="self-meta"></div>
        </footer>
      </section>

      <section class="node node--long" id="node-output" data-kind="text" data-label="s60-out-01" data-x="820" data-y="90">
        <header class="node__head">
          <span class="node__label" id="output-label">s60-out-01</span>
          <span class="node__led" id="output-led" data-state="idle"></span>
        </header>
        <div class="node__body">
          <div class="well" id="output-well">
            <div class="well__text" id="output-text"><p class="placeholder">...?</p></div>
          </div>
        </div>
        <footer class="node__meta">
          <div class="meta-rows" id="output-meta">
            <div class="meta-row"><span>Artifact:</span><b>answer</b></div>
            <div class="meta-row"><span>Type:</span><b>text / plain</b></div>
          </div>
          <button class="btn node__more" id="output-more" type="button" aria-expanded="false"><span class="btn__dot"></span><span class="btn__label">expand</span></button>
        </footer>
      </section>

    </div>
  </div>

  <div id="index-overlay" aria-hidden="true">
    <p id="index-title">index</p>
    <div id="index-grid"></div>
  </div>

  <button id="index-dot" title="index"></button>

  <script src="js/markdown.js"></script>
  <script src="js/face.js"></script>
  <script src="js/facevideo.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/agentloop.js"></script>
  <script src="js/apibrain.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
